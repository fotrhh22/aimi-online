name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: aimi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci-local-only@localhost:5432/aimi_test
      MIGRATION_DATABASE_URL: postgresql://postgres:ci-local-only@localhost:5432/aimi_test
      SESSION_SIGNING_KEY: ci-only-not-a-production-secret-000000000000
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:web-demo
      - name: Build isolated Vercel web demo
        run: npm run build:web-demo
      - name: Add Supabase compatibility roles in disposable CI database
        env:
          PGPASSWORD: ci-local-only
        run: psql -h localhost -U postgres -d aimi_test -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon; CREATE ROLE authenticated;'
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm run test:db
